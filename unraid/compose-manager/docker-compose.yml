services:
  bluesound-snapshot:
    image: ghcr.io/sneakinhysteria/bluesound-snapshots:latest
    container_name: bluesound-snapshot
    network_mode: host
    environment:
      PORT: "8095"
      TZ: "Europe/Berlin"
    volumes:
      - /mnt/user/appdata/bluesound-snapshot:/data
      # Host's D-Bus: the host's Avahi announces the AirPlay receivers.
      - /var/run/dbus:/var/run/dbus
    restart: unless-stopped
